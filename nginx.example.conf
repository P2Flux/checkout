# P2Flux self-hosted checkout - nginx example (nginx 1.25.1 or later).
#
# Serves the unpacked checkout from /var/www/pay (example path) at https://pay.example.com/.
# Replace server_name, certificate paths and root. For a sub-path install (https://example.com/pay/)
# put the files in <root>/pay/ - the locations below match by file name, so they work on a path too.
# Every URL must end with a slash: the page loads its files relative to itself.

server {
    listen 443 ssl;
    http2 on;
    server_name pay.example.com;
    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;

    root  /var/www/pay;
    index index.html;

    # connect-src: the P2Flux API and public RPC of ONE network. For network 'base' (Mainnet) keep
    # this line; for 'base-sepolia' use instead:
    #   https://api-test.p2flux.com https://sepolia.base.org https://base-sepolia-rpc.publicnode.com
    set $p2flux_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.p2flux.com https://mainnet.base.org https://base-rpc.publicnode.com; frame-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'";

    # Security headers, repeated in every location: nginx drops inherited add_header lines in any
    # block that sets one of its own.

    location / {
        add_header Content-Security-Policy $p2flux_csp always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Unknown paths are a 404, never the page: config.js must never be answered with HTML.
        try_files $uri $uri/ =404;
        limit_except GET HEAD { deny all; }
    }

    # Hashed file names: cache forever. (Matches /assets/ at the root or under a path.)
    location ~ /assets/ {
        add_header Content-Security-Policy $p2flux_csp always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The page and your settings: never cached, so an update or a config change applies at once.
    # (Matches /index.html and /config.js at the root or under a path; "/" and "/pay/" reach the page
    # through index, which nginx re-matches against this location.)
    location ~ (^|/)(index\.html|config\.js)$ {
        add_header Content-Security-Policy $p2flux_csp always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    # Do NOT add a Cross-Origin-Opener-Policy header: the checkout reports the result to the shop page
    # that opened it through window.opener, which any COOP value except the default breaks.

    location ~ /\.(?!well-known/) { deny all; }
}

server {
    listen 80;
    server_name pay.example.com;
    # Certificate renewal (Let's Encrypt HTTP-01) before the redirect.
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
